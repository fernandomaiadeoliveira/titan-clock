<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Titan Ephemeris Clock</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    
    header { text-align: center; padding-top: 20px; }
    h1 { font-size: 1.2rem; margin: 0; color: #e2ab54; }
    #status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    
    /* Strict CSS sizing rule for Canvas display */
    #orbitCanvas {
      width: 85vw;
      height: 85vw;
      max-width: 400px;
      max-height: 400px;
      display: block;
      margin: auto;
    }
    
    footer { padding-bottom: 25px; text-align: center; font-size: 0.85rem; line-height: 1.5; color: #ccc; }
    .data-line { margin: 2px 0; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>Saturn-Titan Ephemeris</h1>
    <div id="status">Analytical Orbital Computation (v4.0)</div>
  </header>

  <!-- Hardcoded integer dimensions ONLY. Do NOT add CSS units inside canvas tag attributes! -->
  <canvas id="orbitCanvas" width="800" height="800"></canvas>

  <footer>
    <div class="data-line" id="distance">Distance: Calculating...</div>
    <div class="data-line" id="titan-angle">Titan Orbital Angle: Calculating...</div>
    <div class="data-line" id="ls-angle">Saturn Solar Longitude (Lₛ): Calculating...</div>
    <button onclick="updateEphemeris()">Refresh Clock</button>
  </footer>

  <script>
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');

    // Force internal drawing buffer strictly to 800x800 regardless of device
    canvas.width = 800;
    canvas.height = 800;

    const TITAN_A = 1221870; // Semi-major axis (km)
    const TITAN_ECC = 0.0288;
    const TITAN_PERIOD = 15.94542; // Days
    const T0 = new Date('2026-01-01T00:00:00Z').getTime();

    const SATURN_SUN_PERIOD = 10759.22; // Days (~29.45 Earth years)
    const LS_EPOCH_2026 = 270.8; // Ls reference for Jan 1, 2026

    function getTitanPosition(nowMs) {
      const daysSinceEpoch = (nowMs - T0) / (1000 * 60 * 60 * 24);
      const meanAnomaly = (2 * Math.PI * (daysSinceEpoch % TITAN_PERIOD)) / TITAN_PERIOD;
      
      let E = meanAnomaly;
      for (let i = 0; i < 5; i++) {
        E = E - (E - TITAN_ECC * Math.sin(E) - meanAnomaly) / (1 - TITAN_ECC * Math.cos(E));
      }

      const v = 2 * Math.atan2(
        Math.sqrt(1 + TITAN_ECC) * Math.sin(E / 2),
        Math.sqrt(1 - TITAN_ECC) * Math.cos(E / 2)
      );

      const r = TITAN_A * (1 - TITAN_ECC * Math.cos(E));

      return {
        x: r * Math.cos(v),
        y: r * Math.sin(v),
        r: r
      };
    }

    function getSaturnLs(nowMs) {
      const daysSinceEpoch = (nowMs - T0) / (1000 * 60 * 60 * 24);
      const meanMotionDeg = (360 * daysSinceEpoch) / SATURN_SUN_PERIOD;
      let ls = (LS_EPOCH_2026 + meanMotionDeg) % 360;
      if (ls < 0) ls += 360;
      return ls;
    }

    function updateEphemeris() {
      const now = new Date();
      const titan = getTitanPosition(now.getTime());
      const lsDeg = getSaturnLs(now.getTime());

      let titanOrbitalAngle = Math.atan2(titan.y, titan.x) * (180 / Math.PI);
      if (titanOrbitalAngle < 0) titanOrbitalAngle += 360;

      document.getElementById('status').innerText = `Live Calculations (v4.0) @ ${now.toLocaleTimeString()}`;
      drawClock(titan, lsDeg);

      document.getElementById('distance').innerText = `Saturn–Titan Distance: ${Math.round(titan.r).toLocaleString()} km`;
      document.getElementById('titan-angle').innerText = `Titan Orbital Angle: ${titanOrbitalAngle.toFixed(2)}°`;
      document.getElementById('ls-angle').innerText = `Saturn Solar Longitude (Lₛ): ${lsDeg.toFixed(2)}°`;
    }

    function drawClock(titan, lsDeg) {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;

      ctx.clearRect(0, 0, viewWidth, viewHeight);

      const orbitRadius = Math.min(viewWidth, viewHeight) * 0.38;
      const scale = orbitRadius / TITAN_A;

      const lsRad = lsDeg * (Math.PI / 180);

      // Sun Direction Ray
      const sunX = cx + Math.cos(lsRad) * (orbitRadius * 1.15);
      const sunY = cy - Math.sin(lsRad) * (orbitRadius * 1.15);

      ctx.strokeStyle = 'rgba(255, 223, 0, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(sunX, sunY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Sun icon at the tip of the Ls vector
      ctx.fillStyle = '#ffdf00';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 6, 0, Math.PI * 2);
      ctx.fill();

      // Orbit Path
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Saturn Center (Gold/Orange)
      ctx.fillStyle = '#e2ab54';
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();

      // Titan Position (Cyan)
      const titanX = cx + (titan.x * scale);
      const titanY = cy - (titan.y * scale);

      ctx.fillStyle = '#00d2ff';
      ctx.beginPath();
      ctx.arc(titanX, titanY, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    updateEphemeris();
    setInterval(updateEphemeris, 10000);
  </script>
</body>
</html>
