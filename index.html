<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Titan Ephemeris Clock</title>
  <style>
    body { margin: 0; background: #050508; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: space-between; }
    header { text-align: center; margin-top: 20px; }
    h1 { font-size: 1.2rem; margin: 0; color: #e2ab54; }
    #status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    canvas { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; }
    footer { margin-bottom: 30px; text-align: center; font-size: 0.85rem; line-height: 1.4; color: #aaa; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>Saturn-Titan Ephemeris</h1>
    <div id="status">Connecting directly to JPL...</div>
  </header>

  <canvas id="orbitCanvas" width="800" height="800"></canvas>

  <footer>
    <div id="titan-coords">Titan Pos: Loading...</div>
    <div id="sun-dir">Sun Vector: Loading...</div>
    <button onclick="loadPositions()">Refresh Data</button>
  </footer>

  <script>
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const center = { x: 400, y: 400 };
    const scale = 300 / 1500000; 

    let state = { titan: null, sun: null };

    // Fetch using script injection (JSONP) to bypass CORS completely
    function fetchJPLJSONP(target, centerCode, callbackName) {
      return new Promise((resolve, reject) => {
        const now = new Date();
        const start = now.toISOString().split('T')[0];
        const stopDate = new Date(now.getTime() + 86400000);
        const stop = stopDate.toISOString().split('T')[0];

        window[callbackName] = function(data) {
          try {
            const vec = parseJPLVector(data.result);
            delete window[callbackName];
            script.remove();
            resolve(vec);
          } catch (e) {
            reject(e);
          }
        };

        const script = document.createElement('script');
        script.src = `https://ssd-api.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='${target}'&CENTER='${centerCode}'&EPHEM_TYPE='VECTORS'&START_TIME='${start}'&STOP_TIME='${stop}'&STEP_SIZE='1d'&obj_data='NO'&callback=${callbackName}`;
        script.onerror = () => reject(new Error("Failed to reach JPL API"));
        document.body.appendChild(script);
      });
    }

    function parseJPLVector(text) {
      if (!text) throw new Error("Empty response");
      const soeIndex = text.indexOf("$$SOE");
      const eoeIndex = text.indexOf("$$EOE");
      
      if (soeIndex === -1 || eoeIndex === -1) {
        throw new Error("Invalid orbital block");
      }
      
      const dataBlock = text.substring(soeIndex, eoeIndex);
      
      const xMatch = dataBlock.match(/X\s*=\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/);
      const yMatch = dataBlock.match(/Y\s*=\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/);
      
      if (!xMatch || !yMatch) throw new Error("Parsing failure");
      
      return {
        x: parseFloat(xMatch[1]),
        y: parseFloat(yMatch[1])
      };
    }

    async function loadPositions() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Requesting JPL Horizons vectors...";

      try {
        const titan = await fetchJPLJSONP('606', '500@699', 'jplCallbackTitan');
        const sun = await fetchJPLJSONP('10', '500@699', 'jplCallbackSun');

        statusEl.innerText = `Live JPL Data @ ${new Date().toLocaleTimeString()}`;
        drawClock(titan, sun);
      } catch (err) {
        console.error(err);
        statusEl.innerText = `Error: ${err.message}. Tap to retry.`;
      }
    }

    function drawClock(titan, sun) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sun Direction Ray
      const sunAngle = Math.atan2(sun.y, sun.x);
      ctx.strokeStyle = 'rgba(255, 223, 0, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(center.x + Math.cos(sunAngle) * 380, center.y + Math.sin(sunAngle) * 380);
      ctx.stroke();
      ctx.setLineDash([]);

      // Titan Orbit Path
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(center.x, center.y, 1220000 * scale, 0, Math.PI * 2);
      ctx.stroke();

      // Saturn Center
      ctx.fillStyle = '#e2ab54';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // Titan Position
      const titanX = center.x + (titan.x * scale);
      const titanY = center.y + (titan.y * scale);

      ctx.fillStyle = '#00d2ff';
      ctx.beginPath();
      ctx.arc(titanX, titanY, 10, 0, Math.PI * 2);
      ctx.fill();

      // Footer Data
      document.getElementById('titan-coords').innerText = `Titan: X=${Math.round(titan.x).toLocaleString()} km | Y=${Math.round(titan.y).toLocaleString()} km`;
      document.getElementById('sun-dir').innerText = `Sun Vector Angle: ${(sunAngle * (180 / Math.PI)).toFixed(1)}°`;
    }

    loadPositions();
  </script>
</body>
</html>
