<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Titan Ephemeris Clock</title>
  <style>
    body { margin: 0; background: #050508; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: space-between; }
    header { text-align: center; margin-top: 20px; }
    h1 { font-size: 1.2rem; margin: 0; color: #e2ab54; }
    #status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    canvas { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; }
    footer { margin-bottom: 30px; text-align: center; font-size: 0.85rem; line-height: 1.4; color: #aaa; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>Saturn-Titan Ephemeris</h1>
    <div id="status">Fetching JPL Horizons data...</div>
  </header>

  <canvas id="orbitCanvas" width="800" height="800"></canvas>

  <footer>
    <div id="titan-coords">Titan Pos: Loading...</div>
    <div id="sun-dir">Sun Vector: Loading...</div>
    <button onclick="fetchPositions()">Refresh Data</button>
  </footer>

  <script>
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const center = { x: 400, y: 400 };
    const scale = 300 / 1500000; 

    // Using corsproxy.io for better reliability on iOS
    const PROXY = "https://corsproxy.io/?";

    function buildJPLUrl(target, centerCode) {
      const now = new Date();
      const start = now.toISOString().split('T')[0];
      const stopDate = new Date(now.getTime() + 86400000);
      const stop = stopDate.toISOString().split('T')[0];

      const jplApi = `https://ssd-api.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='${target}'&CENTER='${centerCode}'&EPHEM_TYPE='VECTORS'&START_TIME='${start}'&STOP_TIME='${stop}'&STEP_SIZE='1d'`;
      return PROXY + encodeURIComponent(jplApi);
    }

    async function fetchVector(target, centerCode) {
      const res = await fetch(buildJPLUrl(target, centerCode));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      
      const text = data.result || "";
      const soeIndex = text.indexOf("$$SOE");
      const eoeIndex = text.indexOf("$$EOE");
      
      if (soeIndex === -1 || eoeIndex === -1) {
        throw new Error("Invalid JPL data block");
      }
      
      const dataBlock = text.substring(soeIndex, eoeIndex);
      
      // Parse X and Y coordinate values from JPL output format
      const xMatch = dataBlock.match(/X\s*=\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/);
      const yMatch = dataBlock.match(/Y\s*=\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/);
      
      if (!xMatch || !yMatch) throw new Error("Could not parse coordinates");
      
      return {
        x: parseFloat(xMatch[1]),
        y: parseFloat(yMatch[1])
      };
    }

    async function fetchPositions() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Connecting to JPL Horizons...";

      try {
        // Fetch Titan (606) relative to Saturn (500@699)
        const titan = await fetchVector('606', '500@699');
        
        // Fetch Sun (10) relative to Saturn (500@699)
        const sun = await fetchVector('10', '500@699');

        statusEl.innerText = `Updated: ${new Date().toLocaleTimeString()}`;
        drawClock(titan, sun);
      } catch (err) {
        console.error(err);
        statusEl.innerText = `Error: ${err.message}. Tap Refresh to retry.`;
      }
    }

    function drawClock(titan, sun) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sun Direction Ray
      const sunAngle = Math.atan2(sun.y, sun.x);
      ctx.strokeStyle = 'rgba(255, 223, 0, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(center.x + Math.cos(sunAngle) * 380, center.y + Math.sin(sunAngle) * 380);
      ctx.stroke();
      ctx.setLineDash([]);

      // Titan Orbit Line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(center.x, center.y, 1220000 * scale, 0, Math.PI * 2);
      ctx.stroke();

      // Saturn Center
      ctx.fillStyle = '#e2ab54';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // Titan Position
      const titanX = center.x + (titan.x * scale);
      const titanY = center.y + (titan.y * scale);

      ctx.fillStyle = '#00d2ff';
      ctx.beginPath();
      ctx.arc(titanX, titanY, 10, 0, Math.PI * 2);
      ctx.fill();

      // Updates Footer Labels
      document.getElementById('titan-coords').innerText = `Titan: X=${Math.round(titan.x).toLocaleString()} km | Y=${Math.round(titan.y).toLocaleString()} km`;
      document.getElementById('sun-dir').innerText = `Sun Phase Angle: ${(sunAngle * (180 / Math.PI)).toFixed(1)}°`;
    }

    fetchPositions();
  </script>
</body>
</html>
