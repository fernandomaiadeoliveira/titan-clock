<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Titan Ephemeris Clock</title>
  <style>
    body { margin: 0; background: #050508; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: space-between; }
    header { text-align: center; margin-top: 20px; }
    h1 { font-size: 1.2rem; margin: 0; color: #e2ab54; }
    #status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    canvas { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; }
    footer { margin-bottom: 30px; text-align: center; font-size: 0.85rem; line-height: 1.4; color: #aaa; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>Saturn-Titan Ephemeris</h1>
    <div id="status">Analytical Orbital Computation</div>
  </header>

  <canvas id="orbitCanvas" width="800" height="800"></canvas>

  <footer>
    <div id="titan-coords">Titan Pos: Calculating...</div>
    <div id="sun-dir">Sun Vector: Calculating...</div>
    <button onclick="updateEphemeris()">Refresh Clock</button>
  </footer>

  <script>
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const center = { x: 400, y: 400 };

    // Titan orbital parameters
    const TITAN_A = 1221870; // Semi-major axis (km)
    const TITAN_ECC = 0.0288; // Eccentricity
    const TITAN_PERIOD = 15.94542; // Orbital period in Earth days
    const T0 = new Date('2026-01-01T00:00:00Z').getTime(); // Reference epoch

    // Saturn orbital period around the Sun (~29.45 years)
    const SATURN_SUN_PERIOD = 10759.22; // Days

    function getTitanPosition(nowMs) {
      const daysSinceEpoch = (nowMs - T0) / (1000 * 60 * 60 * 24);
      const meanAnomaly = (2 * Math.PI * (daysSinceEpoch % TITAN_PERIOD)) / TITAN_PERIOD;
      
      // Solve Kepler's Equation: M = E - e*sin(E) via Newton-Raphson iteration
      let E = meanAnomaly;
      for (let i = 0; i < 5; i++) {
        E = E - (E - TITAN_ECC * Math.sin(E) - meanAnomaly) / (1 - TITAN_ECC * Math.cos(E));
      }

      // True Anomaly
      const v = 2 * Math.atan2(
        Math.sqrt(1 + TITAN_ECC) * Math.sin(E / 2),
        Math.sqrt(1 - TITAN_ECC) * Math.cos(E / 2)
      );

      // Radial distance
      const r = TITAN_A * (1 - TITAN_ECC * Math.cos(E));

      return {
        x: r * Math.cos(v),
        y: r * Math.sin(v)
      };
    }

    function getSunDirectionAngle(nowMs) {
      const daysSinceEpoch = (nowMs - T0) / (1000 * 60 * 60 * 24);
      // Saturn-Sun direction vector angle in orbital plane
      const sunAngle = (2 * Math.PI * (daysSinceEpoch % SATURN_SUN_PERIOD)) / SATURN_SUN_PERIOD;
      return sunAngle + Math.PI; // Vector pointing toward the Sun from Saturn
    }

    function updateEphemeris() {
      const now = new Date();
      const titan = getTitanPosition(now.getTime());
      const sunAngle = getSunDirectionAngle(now.getTime());

      document.getElementById('status').innerText = `Live Calculations @ ${now.toLocaleTimeString()}`;
      drawClock(titan, sunAngle);
    }

    function drawClock(titan, sunAngle) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scale = 300 / 1500000;

      // Sun Direction Ray
      ctx.strokeStyle = 'rgba(255, 223, 0, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(center.x + Math.cos(sunAngle) * 380, center.y + Math.sin(sunAngle) * 380);
      ctx.stroke();
      ctx.setLineDash([]);

      // Orbit Path
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(center.x, center.y, TITAN_A * scale, 0, Math.PI * 2);
      ctx.stroke();

      // Saturn Center
      ctx.fillStyle = '#e2ab54';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // Titan Body
      const titanX = center.x + (titan.x * scale);
      const titanY = center.y + (titan.y * scale);

      ctx.fillStyle = '#00d2ff';
      ctx.beginPath();
      ctx.arc(titanX, titanY, 10, 0, Math.PI * 2);
      ctx.fill();

      // Numerical Output
      document.getElementById('titan-coords').innerText = `Titan X: ${Math.round(titan.x).toLocaleString()} km | Y: ${Math.round(titan.y).toLocaleString()} km`;
      document.getElementById('sun-dir').innerText = `Sun Phase Angle: ${(sunAngle * (180 / Math.PI)).toFixed(1)}°`;
    }

    updateEphemeris();
    setInterval(updateEphemeris, 10000); // Update position every 10 seconds
  </script>
</body>
</html>
