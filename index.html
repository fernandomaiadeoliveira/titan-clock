<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Titan Ephemeris Clock</title>
  <style>
    body { margin: 0; background: #050508; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: space-between; }
    header { text-align: center; margin-top: 20px; }
    h1 { font-size: 1.2rem; margin: 0; color: #e2ab54; }
    #status { font-size: 0.8rem; color: #888; margin-top: 4px; }
    canvas { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; }
    footer { margin-bottom: 30px; text-align: center; font-size: 0.85rem; line-height: 1.4; color: #aaa; }
  </style>
</head>
<body>

  <header>
    <h1>Saturn-Titan Ephemeris</h1>
    <div id="status">Fetching JPL Horizons data...</div>
  </header>

  <canvas id="orbitCanvas" width="800" height="800"></canvas>

  <footer>
    <div id="titan-coords">Titan Pos: Loading...</div>
    <div id="sun-dir">Sun Vector: Loading...</div>
  </footer>

  <script>
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const center = { x: 400, y: 400 };

    // Scaled rendering factors (Titan orbit semimajor axis ~ 1.22 million km)
    const scale = 300 / 1500000; 

    // Free CORS proxy to bypass JPL CORS header restrictions on iOS Safari
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    function getJPLUrl(target, centerCode) {
      const now = new Date();
      const start = now.toISOString().split('T')[0];
      const stopDate = new Date(now.getTime() + 86400000);
      const stop = stopDate.toISOString().split('T')[0];

      const jplApi = `https://ssd-api.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='${target}'&CENTER='${centerCode}'&EPHEM_TYPE='VECTORS'&START_TIME='${start}'&STOP_TIME='${stop}'&STEP_SIZE='1m'`;
      return CORS_PROXY + encodeURIComponent(jplApi);
    }

    async function fetchPositions() {
      try {
        // 1. Fetch Titan relative to Saturn (CENTER='500@699', TARGET='606')
        const titanRes = await fetch(getJPLUrl('606', '500@699'));
        const titanData = await titanRes.json();

        // 2. Fetch Sun relative to Saturn (CENTER='500@699', TARGET='10')
        const sunRes = await fetch(getJPLUrl('10', '500@699'));
        const sunData = await sunRes.json();

        // Extract latest coordinates (x, y in km)
        const titanVec = extractLatestVector(titanData.result);
        const sunVec = extractLatestVector(sunData.result);

        document.getElementById('status').innerText = `Live JPL Data @ ${new Date().toLocaleTimeString()}`;
        drawClock(titanVec, sunVec);
      } catch (err) {
        document.getElementById('status').innerText = "API Error. Retrying...";
        console.error(err);
      }
    }

    function extractLatestVector(resultText) {
      // Regex parsing for JPL Horizons Vector output text block
      const lines = resultText.split('\n');
      for (let i = lines.length - 1; i >= 0; i--) {
        if (lines[i].includes('X =')) {
          const x = parseFloat(lines[i].match(/X =\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/)[1]);
          const y = parseFloat(lines[i+1].match(/Y =\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/)[1]);
          return { x, y };
        }
      }
      return { x: 0, y: 0 };
    }

    function drawClock(titan, sun) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Sun Direction Ray
      const sunAngle = Math.atan2(sun.y, sun.x);
      ctx.strokeStyle = 'rgba(255, 223, 0, 0.4)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(center.x + Math.cos(sunAngle) * 380, center.y + Math.sin(sunAngle) * 380);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Orbit Path
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 1220000 * scale, 0, Math.PI * 2);
      ctx.stroke();

      // Draw Saturn
      ctx.fillStyle = '#e2ab54';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 18, 0, Math.PI * 2);
      ctx.fill();

      // Draw Titan
      const titanX = center.x + (titan.x * scale);
      const titanY = center.y + (titan.y * scale);

      ctx.fillStyle = '#00d2ff';
      ctx.beginPath();
      ctx.arc(titanX, titanY, 8, 0, Math.PI * 2);
      ctx.fill();

      // Labels
      document.getElementById('titan-coords').innerText = `Titan X: ${Math.round(titan.x).toLocaleString()} km | Y: ${Math.round(titan.y).toLocaleString()} km`;
      document.getElementById('sun-dir').innerText = `Sun Angle: ${(sunAngle * (180 / Math.PI)).toFixed(1)}°`;
    }

    fetchPositions();
    setInterval(fetchPositions, 60000); // Refresh every 60s
  </script>
</body>
</html>
